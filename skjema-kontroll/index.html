  <h1>Kontroll av innlogging</h1>
  <p>Denne siden kontrollerer at en godkjent Google-konto kan lese oppmøtestatistikken i den nye tjenesten. Den endrer ingen tall og sender ingen e-post.</p>
  <main></main>
  <p id="resultat" role="status">Venter på innlogging.</p>
  <p><a href="/">Tilbake til forsiden</a></p>
  <script src="/js/skjema-client.js"></script>
  <script src="/js/skjema-login.js"></script>
  <script>
    window.addEventListener('skjema-authenticated',async function(){
      const el=document.getElementById('resultat');el.textContent='Kontrollerer servertilgang …';
      try{
        const [leksehjelp,sprakkafe]=await Promise.all([Skjema.attendance('leksehjelp-telling'),Skjema.attendance('sprakkafe-telling')]);
        el.textContent='Innlogging og servertilgang er verifisert.\nLeksehjelp: '+leksehjelp.length+' registreringer.\nSpråkkafé: '+sprakkafe.length+' registreringer.';
      }catch(error){el.textContent='Tilgangen er ikke bekreftet. '+error.message;}
    });
  </script>
