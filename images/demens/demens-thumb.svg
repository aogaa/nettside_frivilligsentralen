<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Et sinn formet av mennesker koblet sammen i et nettverk.">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2a63"/>
      <stop offset="1" stop-color="#081a40"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2b6fd6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0a204e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="thead" cx="0.42" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#17377d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0c2560" stop-opacity="0.45"/>
    </radialGradient>
    <symbol id="tperson" viewBox="0 0 40 48">
      <circle cx="20" cy="13" r="9"/>
      <path d="M6 47 C6 30 12 25 20 25 C28 25 34 30 34 47 Z"/>
    </symbol>
  </defs>

  <rect width="600" height="600" fill="url(#tbg)"/>
  <circle cx="300" cy="285" r="320" fill="url(#tglow)"/>

  <!-- head / mind silhouette -->
  <path d="M312 70
           C452 70 548 172 548 300
           C548 388 494 444 414 458
           C410 486 400 496 372 496
           L318 496
           C298 496 289 486 287 460
           C200 446 132 388 120 306
           C104 306 92 294 92 278
           C92 262 104 250 120 250
           C132 150 190 70 312 70 Z"
        fill="url(#thead)" stroke="#5aa0ff" stroke-width="4" stroke-opacity="0.85"/>

  <!-- links -->
  <g stroke="#79b0ff" stroke-width="3.4" stroke-opacity="0.6" fill="none">
    <line x1="200" y1="360" x2="290" y2="220"/>
    <line x1="290" y1="220" x2="410" y2="200"/>
    <line x1="290" y1="220" x2="360" y2="350"/>
    <line x1="410" y1="200" x2="450" y2="320"/>
    <line x1="360" y1="350" x2="450" y2="320"/>
    <line x1="360" y1="350" x2="290" y2="430"/>
    <line x1="450" y1="320" x2="290" y2="430"/>
    <line x1="200" y1="360" x2="290" y2="430"/>
  </g>

  <g fill="#bcd6ff">
    <circle cx="360" cy="350" r="8"/>
    <circle cx="255" cy="290" r="6"/>
  </g>

  <!-- people nodes -->
  <use href="#tperson" x="170" y="330" width="60" height="72" fill="#f5b841"/>
  <use href="#tperson" x="262" y="188" width="56" height="67" fill="#ffffff"/>
  <use href="#tperson" x="384" y="170" width="52" height="62" fill="#ff7a66"/>
  <use href="#tperson" x="424" y="292" width="50" height="60" fill="#5fd0c6"/>
  <use href="#tperson" x="262" y="400" width="52" height="62" fill="#ff7a66"/>
</svg>
