<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-label="Illustrasjon av et sinn formet av et nettverk av mennesker som er koblet sammen, som symbol på at fellesskap og sosial kontakt kan forebygge demens.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a204e"/>
      <stop offset="0.55" stop-color="#0d2a63"/>
      <stop offset="1" stop-color="#081a40"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b6fd6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#1c4a9e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a204e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="headfill" cx="0.42" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#16357a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0c2560" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <symbol id="person" viewBox="0 0 40 48">
      <circle cx="20" cy="13" r="9"/>
      <path d="M6 47 C6 30 12 25 20 25 C28 25 34 30 34 47 Z"/>
    </symbol>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <ellipse cx="1010" cy="360" rx="720" ry="470" fill="url(#glow)"/>

  <!-- floating particles -->
  <g fill="#8fb4f0" opacity="0.5">
    <circle cx="120" cy="140" r="3"/>
    <circle cx="1440" cy="120" r="4"/>
    <circle cx="1520" cy="470" r="3"/>
    <circle cx="250" cy="650" r="3"/>
    <circle cx="1360" cy="640" r="3"/>
    <circle cx="60" cy="380" r="3"/>
  </g>

  <!-- head / mind silhouette -->
  <g>
    <path d="M1085 95
             C1305 95 1450 250 1450 430
             C1450 560 1370 640 1250 660
             C1245 690 1235 700 1200 700
             L1130 700
             C1105 700 1095 688 1092 660
             C960 640 855 560 835 445
             C820 445 808 432 808 415
             C808 400 818 388 832 386
             C845 250 905 95 1085 95 Z"
          fill="url(#headfill)" stroke="#5aa0ff" stroke-width="3" stroke-opacity="0.85"/>
  </g>

  <!-- network links -->
  <g stroke="#79b0ff" stroke-width="2.4" stroke-opacity="0.55" fill="none">
    <line x1="180" y1="560" x2="330" y2="470"/>
    <line x1="330" y1="470" x2="470" y2="540"/>
    <line x1="330" y1="470" x2="620" y2="410"/>
    <line x1="470" y1="540" x2="620" y2="410"/>
    <line x1="620" y1="410" x2="820" y2="360"/>
    <line x1="820" y1="360" x2="960" y2="270"/>
    <line x1="820" y1="360" x2="1000" y2="470"/>
    <line x1="960" y1="270" x2="1120" y2="250"/>
    <line x1="960" y1="270" x2="1080" y2="400"/>
    <line x1="1120" y1="250" x2="1250" y2="360"/>
    <line x1="1080" y1="400" x2="1250" y2="360"/>
    <line x1="1080" y1="400" x2="1000" y2="470"/>
    <line x1="1000" y1="470" x2="1160" y2="530"/>
    <line x1="1250" y1="360" x2="1160" y2="530"/>
    <line x1="1080" y1="400" x2="1160" y2="530"/>
  </g>

  <!-- glowing neuron dots -->
  <g fill="#bcd6ff">
    <circle cx="620" cy="410" r="6"/>
    <circle cx="820" cy="360" r="7"/>
    <circle cx="1080" cy="400" r="6"/>
    <circle cx="1180" cy="330" r="5"/>
    <circle cx="700" cy="300" r="4"/>
  </g>

  <!-- people nodes (community as neurons) -->
  <g>
    <g filter="url(#soft)" opacity="0.55">
      <use href="#person" x="148" y="522" width="64" height="77" fill="#f5b841"/>
      <use href="#person" x="930" y="234" width="60" height="72" fill="#ff7a66"/>
      <use href="#person" x="1093" y="218" width="54" height="65" fill="#5fd0c6"/>
    </g>
    <use href="#person" x="148" y="522" width="64" height="77" fill="#f5b841"/>
    <use href="#person" x="304" y="439" width="52" height="62" fill="#ffffff"/>
    <use href="#person" x="448" y="513" width="44" height="53" fill="#5fd0c6"/>
    <use href="#person" x="930" y="234" width="60" height="72" fill="#ff7a66"/>
    <use href="#person" x="1093" y="218" width="54" height="65" fill="#f5b841"/>
    <use href="#person" x="1225" y="330" width="50" height="60" fill="#ffffff"/>
    <use href="#person" x="977" y="442" width="46" height="55" fill="#5fd0c6"/>
    <use href="#person" x="1130" y="500" width="40" height="48" fill="#ff7a66"/>
  </g>
</svg>
